{% extends "layouts/base.html" %}
{% block content %}
<h2 class = "text-xl font-semibold mb-6">Students</h2>
<div class = "card bg-white overflow-hidden"><table class = "w-full text-sm">
<thead class = "bg-slate-50"><tr><th class = "text-left px-5 py-3 text-slate-500">Name</th><th class = "text-left px-5 py-3 text-slate-500">Email</th><th class = "text-left px-5 py-3 text-slate-500">Status</th></tr></thead>
<tbody>{% for student in students %}<tr><td class = "px-5 py-3"><a href = "{% url 'student_detail' student.pk %}" class = "text-blue-600 font-medium">{{ student.full_name }}</a></td><td class = "px-5 py-3">{{ student.email }}</td><td class = "px-5 py-3">{{ student.status }}</td></tr>{% empty %}<tr><td colspan = "3" class = "px-5 py-10 text-center text-slate-400">No students yet</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}

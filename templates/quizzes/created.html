<!DOCTYPE html>
<html lang = "en">
<head>
  <meta charset = "UTF-8">
  <meta name = "viewport" content = "width=device-width, initial-scale=1.0">
  <title>Quiz Created Successfully</title>
  <script src = "https://cdn.tailwindcss.com"></script>
</head>
<body class = "min-h-screen bg-white text-slate-700">
  <main class = "flex min-h-screen items-center justify-center px-6 py-12">
    <div class = "max-w-xl text-center">
      <h1 class = "mb-5 text-3xl font-semibold text-slate-700">Quiz Created Successfully</h1>
      <p class = "mb-16 text-sm leading-5 text-slate-600">
        {{ quiz.title }}
        {% if quiz.course %} in {{ quiz.course }}{% endif %}
        {% if quiz.subject %} with subject {{ quiz.subject }}{% endif %}
        {% if quiz.batch %} for {{ quiz.batch.name }}{% endif %}
      </p>
      <a href = "{% url 'dashboard' %}" class = "inline-block bg-blue-600 px-5 py-3 text-sm font-medium text-white">Back to Dashboard</a>
    </div>
  </main>
</body>
</html>

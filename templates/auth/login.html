<!DOCTYPE html>
<html lang = "en">
<head>
<meta charset = "UTF-8"><title>TIPS-G</title>
<script src = "https://cdn.tailwindcss.com"></script>
</head>
<body class = "bg-slate-50 min-h-screen flex items-center justify-center">
<div class = "w-full max-w-md">
  <div class = "text-center mb-8">
    <div class = "flex items-center justify-center gap-2 mb-2">
      <span class = "font-bold text-2xl">TIPS-G</span>
    </div>
    <p class = "text-slate-500">Teacher Admin Panel</p>
  </div>
  <div class = "bg-white shadow-sm border border-slate-100 p-8">
    {% for message in messages %}
    <p class = "mb-4 text-sm text-red-600">{{ message }}</p>
    {% endfor %}
    <form method = "post">{% csrf_token %}
      <div class = "mb-4">
        <label for = "username" class = "block text-sm font-medium text-slate-700 mb-1.5">Username</label>
        <input id = "username" type = "text" name = "username" required class = "w-full px-4 py-2.5 border border-slate-200">
      </div>
      <div class = "mb-6">
        <label for = "password" class = "block text-sm font-medium text-slate-700 mb-1.5">Password</label>
        <input id = "password" type = "password" name = "password" required class = "w-full px-4 py-2.5 border border-slate-200">
      </div>
      <button type = "submit" class = "w-full bg-blue-600 text-white font-medium py-2.5 ">Sign In</button>
    </form>
  </div>
</div>
</body>
</html>

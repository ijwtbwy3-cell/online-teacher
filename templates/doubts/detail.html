{% extends "layouts/base.html" %}
{% block content %}
<div class = "max-w-2xl">
<div class = "card p-6 bg-white mb-4"><h2 class = "text-xl font-semibold">{{ doubt.title }}</h2>
<p class = "text-sm text-slate-500 mt-1">{{ doubt.student.full_name }}</p>
<p class = "mt-3 whitespace-pre-line">{{ doubt.description }}</p></div>
{% if doubt.answer %}<div class = "card p-6 bg-emerald-50 border-emerald-100"><h3 class = "font-semibold text-emerald-800 mb-2">Answer</h3><p>{{ doubt.answer }}</p></div>
{% else %}<div class = "card p-6 bg-white"><form method = "post">{% csrf_token %}
<label for = "answer" class = "sr-only">Answer</label>
<textarea id = "answer" name = "answer" rows = "4" required class = "w-full px-3 py-2 border text-sm mb-3"></textarea>
<button class = "px-5 py-2 bg-blue-600 text-white text-sm">Submit Answer</button></form></div>{% endif %}
</div>
{% endblock %}

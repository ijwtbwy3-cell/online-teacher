{% extends "layouts/base.html" %}
{% block content %}
<div class = "mx-auto max-w-md py-8">
  <h2 class = "mb-10 text-center text-2xl font-semibold text-slate-700">Add New Exam</h2>
  <form method = "post" class = "space-y-4">
    {% csrf_token %}
    <div>
      <label for = "exam-title" class = "sr-only">Exam title</label>
      <textarea id = "exam-title" name = "title" maxlength = "255" required rows = "3" placeholder = "Enter topic of Exam..." class = "w-full resize-none border-0 bg-slate-100 px-3 py-3 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label for = "exam-course" class = "sr-only">Course</label>
      <input id = "exam-course" type = "text" name = "course" placeholder = "Enter course" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "exam-subject" class = "sr-only">Subject</label>
      <input id = "exam-subject" type = "text" name = "subject" placeholder = "Enter subject" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "exam-batch" class = "sr-only">Batch</label>
      <select id = "exam-batch" name = "batch" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value = "">Select Batch</option>
        {% for batch in batches %}
        <option value = "{{ batch.pk }}">{{ batch.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class = "pt-1">
      <p class = "mb-2 px-1 text-sm text-slate-600">Exam Schedule (optional)</p>
      <div class = "space-y-3">
        <div>
          <label for = "exam-start" class = "mb-1 block px-1 text-xs text-slate-500">Starts</label>
          <input id = "exam-start" type = "datetime-local" name = "start_at" class = "w-full border border-slate-300 bg-slate-100 px-3 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div>
          <label for = "exam-end" class = "mb-1 block px-1 text-xs text-slate-500">Ends</label>
          <input id = "exam-end" type = "datetime-local" name = "end_at" class = "w-full border border-slate-300 bg-slate-100 px-3 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
    </div>
    <div>
      <label for = "exam-marks" class = "mb-1 block px-1 text-sm text-slate-600">Total Marks</label>
      <input id = "exam-marks" type = "number" name = "total_marks" min = "0" value = "100" class = "w-full border border-slate-300 bg-white px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <label class = "flex items-center gap-2 px-1 text-sm text-slate-600">
      <input type = "checkbox" name = "is_published" class = "h-4 w-4 accent-blue-600">
      Publish exam
    </label>
    <button type = "submit" class = "mt-10 w-full bg-blue-600 px-5 py-3 text-sm font-medium text-white">+ Add Exam</button>
  </form>
</div>
{% endblock %}

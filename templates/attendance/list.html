{% extends "layouts/base.html" %}
{% block content %}
<h2 class = "text-xl font-semibold mb-6">Attendance</h2>
<div class = "card bg-white overflow-hidden"><table class = "w-full text-sm">
<thead class = "bg-slate-50 border-b"><tr><th class = "text-left px-5 py-3 text-slate-500">Batch</th><th class = "text-left px-5 py-3 text-slate-500">Date</th><th class = "text-left px-5 py-3 text-slate-500">Topic</th></tr></thead>
<tbody class = "divide-y">{% for session in sessions %}<tr><td class = "px-5 py-3">{{ session.batch.name }}</td><td class = "px-5 py-3">{{ session.date|date:"d M Y" }}</td><td class = "px-5 py-3">{{ session.topic|default:"—" }}</td></tr>
{% empty %}<tr><td colspan = "3" class = "px-5 py-10 text-center text-slate-400">No sessions</td></tr>{% endfor %}</tbody></table></div>
{% endblock %}

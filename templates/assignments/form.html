{% extends "layouts/base.html" %}
{% block content %}
<div class = "create-form flex min-h-[calc(100vh-128px)] flex-col justify-center py-8">
  <h2 class = "mb-10 text-center text-2xl font-semibold text-slate-700">Add New Assignment</h2>
  <form method = "post" class = "space-y-4">
    {% csrf_token %}
    <div>
      <label for = "assignment-title" class = "sr-only">Assignment title</label>
      <textarea id = "assignment-title" name = "title" maxlength = "255" required rows = "3" placeholder = "Enter topic of Assignment..." class = "w-full resize-none border-0 bg-slate-100 px-3 py-3 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label for = "assignment-description" class = "sr-only">Description</label>
      <textarea id = "assignment-description" name = "description" rows = "3" placeholder = "Enter assignment description..." class = "w-full resize-none border border-slate-300 bg-white px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label for = "assignment-course" class = "sr-only">Course</label>
      <input id = "assignment-course" type = "text" name = "course" placeholder = "Enter course" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "assignment-subject" class = "sr-only">Subject</label>
      <input id = "assignment-subject" type = "text" name = "subject" placeholder = "Enter subject" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "assignment-batch" class = "sr-only">Batch</label>
      <select id = "assignment-batch" name = "batch" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value = "">Select Batch</option>
        {% for batch in batches %}
        <option value = "{{ batch.pk }}">{{ batch.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class = "pt-1">
      <label for = "assignment-due" class = "mb-2 block px-1 text-sm text-slate-600">Due Date (optional)</label>
      <input id = "assignment-due" type = "datetime-local" name = "due_date" class = "w-full border border-slate-300 bg-slate-100 px-3 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "assignment-marks" class = "mb-1 block px-1 text-sm text-slate-600">Maximum Marks</label>
      <input id = "assignment-marks" type = "number" name = "max_marks" min = "0" value = "100" class = "w-full border border-slate-300 bg-white px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <label class = "flex items-center gap-2 px-1 text-sm text-slate-600">
      <input type = "checkbox" name = "is_published" class = "h-4 w-4 accent-blue-600">
      Publish assignment
    </label>
    <button type = "submit" class = "mt-10 w-full bg-blue-600 px-5 py-3 text-sm font-medium text-white">+ Add Assignment</button>
  </form>
</div>
{% endblock %}

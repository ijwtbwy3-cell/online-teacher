{% extends "layouts/base.html" %}
{% block content %}
<div class = "create-form flex min-h-[calc(100vh-128px)] flex-col justify-center py-8">
  <h2 class = "mb-10 text-center text-2xl font-semibold text-slate-700">Add New Class</h2>
  <form method = "post" class = "space-y-4">
    {% csrf_token %}
    <div>
      <label for = "class-title" class = "sr-only">Class topic</label>
      <textarea id = "class-title" name = "title" maxlength = "255" required rows = "3" placeholder = "Enter topic of Class..." class = "w-full resize-none rounded-md border-0 bg-slate-100 px-3 py-3 text-sm placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
    </div>
    <div>
      <label for = "class-batch" class = "sr-only">Batch</label>
      <select id = "class-batch" name = "batch" class = "w-full border border-slate-800 bg-white px-4 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <option value = "">Select Batch</option>
        {% for batch in batches %}
        <option value = "{{ batch.pk }}">{{ batch.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class = "pt-1">
      <label for = "class-scheduled-at" class = "mb-2 block px-1 text-sm text-slate-600">Class Schedule</label>
      <input id = "class-scheduled-at" type = "datetime-local" name = "scheduled_at" required class = "w-full rounded-md border border-slate-300 bg-slate-100 px-3 py-3 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <div>
      <label for = "class-duration" class = "mb-2 block px-1 text-sm text-slate-600">Duration (minutes)</label>
      <input id = "class-duration" type = "number" name = "duration_minutes" min = "1" value = "60" class = "w-full rounded-md border border-slate-300 bg-white px-3 py-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
    </div>
    <button type = "submit" class = "mt-10 w-full bg-blue-600 px-5 py-3 text-sm font-medium text-white">+ Add Class</button>
  </form>
</div>
{% endblock %}
